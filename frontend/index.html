<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" />
    <title>DrawCode 智能图号系统</title>
    <script>
      // 提前应用主题，避免闪烁；非法主题值回退到默认主题
      (function () {
        var t = localStorage.getItem('dc-theme')
        if (['lan', 'cui', 'zi', 'jin', 'tao', 'yun'].indexOf(t) < 0) {
          t = 'lan'
          localStorage.setItem('dc-theme', 'lan')
        }
        document.documentElement.dataset.theme = t
        if (localStorage.getItem('dc-dark') === '1') document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
