<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233A7BD5'/%3E%3Cstop offset='1' stop-color='%2350C2A0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='44' height='44' rx='11' fill='url(%23g)'/%3E%3Ctext x='24' y='33' font-size='24' font-weight='700' fill='#fff' text-anchor='middle' font-family='PingFang SC,Microsoft YaHei,sans-serif'%3E图%3C/text%3E%3C/svg%3E" />
    <title>DrawCode 智能图号系统</title>
    <script>
      // 提前应用主题，避免闪烁；非法主题值回退到默认主题
      (function () {
        var t = localStorage.getItem('dc-theme')
        if (['lan', 'cui', 'zi', 'jin', 'tao', 'yun'].indexOf(t) < 0) {
          t = 'lan'
          localStorage.setItem('dc-theme', 'lan')
        }
        document.documentElement.dataset.theme = t
        if (localStorage.getItem('dc-dark') === '1') document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
